[profile.default]
src = "src"
test = "test"
script = "scripts"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.17"
evm_version = "london"

# File system permissions
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read-write", path = "./deployment-arbitrum.txt" },
    { access = "read-write", path = "./cache/" },
    { access = "read-write", path = "./out/" }
]

# RPC endpoints
[rpc_endpoints]
eth = "${ETH_RPC_URL}"
bsc = "${BSC_RPC_URL}"
base = "${BASE_RPC_URL}"
arb = "${ARB_RPC_URL}"
xlayer = "${XLAYER_RPC_URL}"

[etherscan]
xlayer = { key = "${OKLINK_API_KEY}", chain = 196, url = "https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
